[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-detect"
dynamic = ["version"]
description = "Safety-first mission orchestration prototype for non-hazardous UAV payload deployment"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Multi-Detect contributors" }]
dependencies = ["jsonschema>=4.20"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "jsonschema>=4.20", "requests>=2.32"]
vision = ["numpy>=1.26", "opencv-contrib-python>=4.10", "onnxruntime>=1.18"]
vision-gpu = [
  "numpy>=1.26",
  "opencv-contrib-python>=4.10",
  "onnxruntime-gpu==1.22.0",
]
pixhawk = ["pymavlink>=2.4", "pyserial>=3.5", "jsonschema>=4.20"]
security = ["PyNaCl>=1.5"]
jetson = ["cuda-python==12.2.1"]
model-tools = ["onnx>=1.16,<2"]

[project.scripts]
multi-detect = "multidetect.cli:main"
multidetect-sim = "multidetect.simulator.__main__:main"
multidetect-release-gate = "multidetect.release_gate:main"
multidetect-release-mode-evidence = "multidetect.release_mode_evidence:main"
multidetect-field-preflight = "multidetect.field_link_preflight:main"
multidetect-field-preflight-verify = "multidetect.field_link_preflight:verify_main"
multidetect-field-address-state-verify = "multidetect.field_link_address_state:main"
multidetect-target-observation-diagnostics-verify = "multidetect.target_observation_diagnostics:main"
multidetect-target-observation-session-verify = "multidetect.target_observation_diagnostics_session:main"
multidetect-target-observation-recording-manifest-verify = "multidetect.target_observation_recording_manifest:main"
multidetect-field-session = "multidetect.field_session_acceptance:main"
multidetect-field-capture = "multidetect.field_session_capture:main"
multidetect-field-capture-verify = "multidetect.field_session_capture:verify_main"
multidetect-gnss-capture = "multidetect.gnss_capture:main"
multidetect-gnss-capture-verify = "multidetect.gnss_capture:verify_main"
multidetect-gnss-to-replay-sidecar = "multidetect.gnss_capture_sidecar:main"
multidetect-field-evidence-check = "multidetect.field_evidence_bundle:main"
multidetect-camera-mount-survey = "multidetect.camera_mount_survey:main"
multidetect-alert-link-bench = "multidetect.alert_link_bench:main"
multidetect-alert-link-bench-verify = "multidetect.alert_link_bench:verify_main"
multidetect-gr01-link-bench-verify = "multidetect.gr01_bench:verify_main"
multidetect-gr01-release-session = "multidetect.gr01_release_session:main"
multidetect-gr01-release-session-plan = "multidetect.gr01_release_plan:main"
multidetect-gr01-release-session-handoff = "multidetect.gr01_release_handoff:main"
multidetect-target-accuracy-from-replay = "multidetect.geolocation_survey:main"
multidetect-target-survey-template = "multidetect.geolocation_survey_template:main"
multidetect-mission-journal = "multidetect.mission_journal:main"
multidetect-sim-external-evidence = "multidetect.simulator_external_evidence:main"
multidetect-sim-combined-evidence = "multidetect.simulator_combined_evidence:main"
multidetect-sim-safety-evidence = "multidetect.simulator.safety_evidence:main"
multidetect-sim-scenario-matrix = "multidetect.simulator.scenario_matrix:main"
multidetect-sim-3d-control-verify = "multidetect.simulator.three_d_control:main"
multidetect-sim-scene-stream = "multidetect.simulator.scene_state:main"
multidetect-sim-scene-stream-verify = "multidetect.simulator.scene_state:verify_main"
multidetect-sim-scene-stream-set-verify = "multidetect.simulator.scene_stream_set:main"
multidetect-plan = "multidetect.autonomy.planner_cli:main"
multidetect-mission-compile = "multidetect.mission_compile_cli:main"
multidetect-px4-mission-feedback = "multidetect.px4_mission_feedback_cli:main"
multidetect-px4-mission-feedback-verify = "multidetect.px4_mission_feedback_cli:verify_main"
multidetect-px4-runtime-profile-provision = "multidetect.px4_mission_feedback_cli:provision_main"
multidetect-px4-runtime-capture = "multidetect.px4_runtime_capture:main"
multidetect-px4-runtime-capture-receipt = "multidetect.px4_runtime_capture_receipt:main"
multidetect-px4-runtime-capture-receipt-verify = "multidetect.px4_runtime_capture_receipt:verify_main"
multidetect-gazebo-geolocation-matrix = "multidetect.gazebo_geolocation_regime_matrix:main"
multidetect-qgc-visual-review = "multidetect.qgc_visual_acceptance:main"
multidetect-runtime-report-verify = "multidetect.runtime_report_binding:main"
multidetect-runtime-report-set-verify = "multidetect.runtime_report_binding_set:main"
multidetect-runtime-observation-build = "multidetect.runtime_observation:main"
multidetect-runtime-profile-set-verify = "multidetect.runtime_profile_binding_set:main"
multidetect-px4-mission-feedback-profile-bind = "multidetect.px4_mission_feedback_profile_binding:main"
multidetect-live-runtime-observation-mission-bind = "multidetect.live_runtime_observation_mission_binding:main"
multidetect-replay-set-intake = "multidetect.replay_set_intake_cli:main"
multidetect-replay-annotations = "multidetect.replay_annotation_cli:main"
multidetect-replay-predictions = "multidetect.replay_prediction_cli:main"
multidetect-field-replay-campaign = "multidetect.field_replay_campaign:main"
multidetect-replay-annotation-ui = "multidetect.replay_annotation_workbench:main"
multidetect-deployment-recording-attestation = "multidetect.deployment_recording_attestation_cli:main"
multidetect-rtsp-to-replay = "multidetect.rtsp_evidence_replay:main"
multidetect-evidence-transfer = "multidetect.evidence_bundle_transfer:main"
multidetect-jetson-evidence-package-verify = "multidetect.jetson_evidence_package:main"
multidetect-jetson-evidence-install-verify = "multidetect.jetson_evidence_install:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "multidetect.product_version.__version__" }

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning:_pytest\\.assertion\\.rewrite",
  "ignore:ast\\.(Str|Num|NameConstant) is deprecated.*:DeprecationWarning:_pytest\\.assertion\\.rewrite",
  "ignore:Converting a tensor to a Python boolean.*:Warning",
  "ignore:'torch\\.onnx\\.symbolic_opset9\\._cast_Bool' is deprecated.*:FutureWarning:torch\\.onnx\\.symbolic_opset9",
  "ignore:Exporting a model to ONNX with a batch_size other than 1.*:UserWarning:torch\\.onnx\\.symbolic_opset9",
]
markers = [
    "onboard: fast regression gate for onboard autonomy and mission-planning tests",
    "timing: depends on real threads and wall-clock timing; excluded from the default onboard gate",
    "optional: requires local external benchmark data when available",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# Ignored scratch/temp roots (pytest basetemp lives in .tmp during releases).
extend-exclude = [".tmp", "tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
